<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Courses — Dégustation Bret's</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react/jsx-dev-runtime": "https://esm.sh/react@18.3.1/jsx-dev-runtime",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
  }
}
</script>
<style>
body{margin:0;}
.print-only{display:none;}
@media print {
  .screen-only{display:none !important;}
  .print-only{display:block !important;}
}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-type="module" data-presets="react">
import { useState, useEffect, useRef } from "react";
import { createRoot } from "react-dom/client";

/* ---------- Firebase (SDK compat) ---------- */

const firebaseConfig = {
  apiKey: "AIzaSyD7yse_HDyDwXX_akwVfA_ABbOMHRZdK8o",
  authDomain: "degustation-brets.firebaseapp.com",
  projectId: "degustation-brets",
  storageBucket: "degustation-brets.firebasestorage.app",
  messagingSenderId: "1069235432277",
  appId: "1:1069235432277:web:c7c9dcf75de0ed43739ddc"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ---------- Données ---------- */
/* Liste volontairement à plat et triée par ordre alphabétique : cette page
   est partagée avec les participants, donc aucun regroupement par manche
   ni référence à l'appli de jeu (ça spoilerait la dégustation). */

const FLAVORS_RAW = [
  "Ail Confit & Herbes de Provence","Tajine de Poulet aux Épices","Brie Truffe","Beurre Persillé",
  "Camembert & Truffe","BBQ Flambé au Whisky","BBQ à la Mexicaine","BBQ & Jalapeño","Sauce Barbecue",
  "Cheddar Bière","Fromage Frais & Fines Herbes","Chèvre & Piment d'Espelette","Cheddar Oignons de Roscoff","Camembert",
  "Aligot à l'Aveyronnaise","Bleu d'Auvergne AOP","Tartiflette","Cheddar Jalapeño","Pesto Mozzarella",
  "Fromage du Jura","Poivrons Grillés Chorizo","Pizza au Feu de Bois","Carbonara","Falafels à la Libanaise",
  "Aïoli","Yakitori","Carbonade Flamande","Poulet Braisé",
  "Côte de Bœuf Grillée","Bacon Grillé","Kebab","Sauce Curry","Pili Pili","Moutarde au Piment de Cayenne",
  "Sauce Pommes Frites","Petits Oignons","Beurre Salé","Cèpes","Sel & Vinaigre","Miel Moutarde",
  "Nature (l'Originale)","Nature à l'Ancienne / La Paysanne",
  "Sel de Guérande (ondulée)","La chips Bio","Rôtisserie Nature","Rôtisserie Ail Confit & Herbes de Provence",
  "Chips de Légumes","Sel de Guérande (sarrasin)","Curry Crème (sarrasin)","À la Forestière (sarrasin)",
  "Nature au Sel de Guérande (So Crack)","Tomate Olive Origan (So Crack)","Sweet & Salty (So Crack)",
  "Moutarde Pickles (So Crack)","Curry Fruité (So Crack)",
  "Nature (crêpe)","Fruits Rouges (crêpe)","Beurre Citron (crêpe)","Caramel au Beurre Salé (crêpe)",
];

// { flavor, id } trié alphabétiquement — l'id garde une référence stable en base
// mais n'est jamais affiché, donc aucun ordre/numéro n'est révélé aux joueurs.
const FLAVORS = FLAVORS_RAW
  .map((flavor, i) => ({ flavor, id: "f" + i }))
  .sort((a, b) => a.flavor.localeCompare(b.flavor, "fr"));

const BUYERS = ["Astrid", "Nicolas", "Morgane", "Lucas", "Baptiste", "Mélanie", "Sylvia", "Xavier"];

function formatDate(iso) {
  if (!iso) return "";
  const d = new Date(iso + "T00:00:00");
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric" });
}

/* ---------- App ---------- */

function App() {
  const [items, setItems] = useState({});
  const [loading, setLoading] = useState(true);
  const [printMode, setPrintMode] = useState(null); // null | "missing" | "byBuyer"
  const saveTimers = useRef({});
  const itemsRef = useRef(items);
  itemsRef.current = items;

  useEffect(() => {
    const unsub = db.collection("shopping").onSnapshot((snap) => {
      const data = {};
      snap.forEach((d) => { data[d.id] = d.data(); });
      setItems(data);
      setLoading(false);
    }, () => setLoading(false));
    return unsub;
  }, []);

  useEffect(() => {
    if (!printMode) return;
    const t = setTimeout(() => window.print(), 150);
    function onAfterPrint() { setPrintMode(null); }
    window.addEventListener("afterprint", onAfterPrint);
    return () => { clearTimeout(t); window.removeEventListener("afterprint", onAfterPrint); };
  }, [printMode]);

  function updateItem(id, patch) {
    setItems((prev) => ({ ...prev, [id]: { ...prev[id], ...patch } }));
    if (saveTimers.current[id]) clearTimeout(saveTimers.current[id]);
    saveTimers.current[id] = setTimeout(() => {
      const current = itemsRef.current[id] || {};
      db.collection("shopping").doc(id).set({
        buyer: current.buyer ?? "",
        date: current.date ?? "",
        expiry: current.expiry ?? "",
        ...patch,
      }, { merge: true });
    }, 400);
  }

  const total = FLAVORS.length;
  const assigned = Object.values(items).filter((v) => v?.buyer && v.buyer.trim()).length;

  const soonestExpiry = Object.values(items)
    .map((v) => v?.expiry)
    .filter(Boolean)
    .sort()[0];

  const missingFlavors = FLAVORS.filter(({ id }) => !(items[id]?.buyer && items[id].buyer.trim()));

  const byBuyer = {};
  FLAVORS.forEach(({ flavor, id }) => {
    const b = items[id]?.buyer;
    if (b && b.trim()) {
      if (!byBuyer[b]) byBuyer[b] = [];
      byBuyer[b].push({ flavor, expiry: items[id]?.expiry });
    }
  });
  const buyersWithItems = BUYERS.filter((b) => byBuyer[b]?.length);

  return (
    <>
      <div className="screen-only min-h-screen bg-orange-50 px-4 py-6">
        <div className="max-w-lg mx-auto">
          <div className="bg-slate-900 text-orange-50 rounded-3xl p-6 shadow-xl mb-4">
            <p className="text-amber-400 text-xs font-bold uppercase tracking-widest mb-1">Avant la soirée</p>
            <h1 className="text-2xl font-extrabold mb-2">🛒 Courses à faire</h1>
            <p className="text-orange-50/60 text-sm mb-3">
              {loading ? "Chargement..." : `${assigned} / ${total} saveurs prises en charge`}
            </p>
            <div className="w-full h-1.5 bg-white/10 rounded-full mb-4 overflow-hidden">
              <div className="h-full bg-rose-500 rounded-full" style={{ width: `${total ? (assigned / total) * 100 : 0}%` }} />
            </div>
            {soonestExpiry ? (
              <div className="bg-rose-500/15 border border-rose-400/40 rounded-2xl px-4 py-3">
                <p className="text-rose-300 text-[10px] font-bold uppercase tracking-widest mb-0.5">⏳ Deadline soirée</p>
                <p className="text-orange-50 text-sm font-bold">Avant le {formatDate(soonestExpiry)}</p>
                <p className="text-orange-50/50 text-xs mt-0.5">Date de péremption la plus proche parmi tous les paquets.</p>
              </div>
            ) : (
              <p className="text-orange-50/40 text-xs">Aucune date de péremption renseignée pour l'instant.</p>
            )}
          </div>

          <div className="flex gap-3 mb-4">
            <button
              onClick={() => setPrintMode("missing")}
              className="flex-1 bg-white text-slate-900 font-bold rounded-full py-3 text-sm shadow-xl"
            >
              📄 Export : reste à acheter
            </button>
            <button
              onClick={() => setPrintMode("byBuyer")}
              className="flex-1 bg-white text-slate-900 font-bold rounded-full py-3 text-sm shadow-xl"
            >
              📄 Export : qui ramène quoi
            </button>
          </div>

          <div className="bg-white rounded-3xl p-5 shadow-xl mb-4">
            <div className="grid grid-cols-[1fr_auto_auto_auto] gap-x-2 gap-y-1 text-[10px] font-bold uppercase tracking-widest text-slate-400 px-1 mb-2">
              <span>Saveur</span>
              <span>Acheteur</span>
              <span>Achat</span>
              <span>Péremption</span>
            </div>

            {FLAVORS.map(({ flavor, id }) => {
              const item = items[id] || {};
              const done = !!(item.buyer && item.buyer.trim());
              return (
                <div key={id} className="py-3 border-b border-orange-100 last:border-0">
                  <p className={"text-sm mb-1.5 " + (done ? "text-slate-400 line-through" : "text-slate-700 font-semibold")}>{flavor}</p>
                  <div className="flex flex-wrap gap-2">
                    <select
                      value={item.buyer || ""}
                      onChange={(e) => updateItem(id, { buyer: e.target.value })}
                      className="bg-orange-50 rounded-lg px-2 py-1.5 text-xs text-slate-700 outline-none focus:ring-2 focus:ring-rose-400"
                    >
                      <option value="">— Qui ? —</option>
                      {BUYERS.map((b) => <option key={b} value={b}>{b}</option>)}
                    </select>
                    <label className="flex items-center gap-1 text-[10px] text-slate-400">
                      Achat
                      <input
                        type="date"
                        value={item.date || ""}
                        onChange={(e) => updateItem(id, { date: e.target.value })}
                        className="bg-orange-50 rounded-lg px-2 py-1.5 text-xs text-slate-700 outline-none focus:ring-2 focus:ring-rose-400"
                      />
                    </label>
                    <label className="flex items-center gap-1 text-[10px] text-slate-400">
                      DLC
                      <input
                        type="date"
                        value={item.expiry || ""}
                        onChange={(e) => updateItem(id, { expiry: e.target.value })}
                        className="bg-orange-50 rounded-lg px-2 py-1.5 text-xs text-slate-700 outline-none focus:ring-2 focus:ring-rose-400"
                      />
                    </label>
                  </div>
                </div>
              );
            })}
          </div>

          <p className="text-center text-xs text-slate-400 mt-2">📡 Mis à jour en direct pour tout le monde.</p>
        </div>
      </div>

      {printMode === "missing" && (
        <div className="print-only p-8 text-slate-900">
          <h1 className="text-xl font-bold mb-1">🥔 Chips Bret's — Reste à acheter</h1>
          <p className="text-xs text-slate-500 mb-6">Généré le {formatDate(new Date().toISOString().slice(0, 10))} — {missingFlavors.length} saveur(s) restante(s)</p>
          <ul className="space-y-2">
            {missingFlavors.map(({ flavor, id }) => (
              <li key={id} className="text-sm">☐ {flavor}</li>
            ))}
          </ul>
          {missingFlavors.length === 0 && <p className="text-sm text-slate-500">Tout est pris en charge, bravo !</p>}
        </div>
      )}

      {printMode === "byBuyer" && (
        <div className="print-only p-8 text-slate-900">
          <h1 className="text-xl font-bold mb-1">🥔 Chips Bret's — Qui ramène quoi</h1>
          <p className="text-xs text-slate-500 mb-6">Généré le {formatDate(new Date().toISOString().slice(0, 10))}</p>
          {buyersWithItems.length === 0 && <p className="text-sm text-slate-500">Personne n'a encore été assigné.</p>}
          {buyersWithItems.map((b) => (
            <div key={b} className="mb-5">
              <h2 className="text-sm font-bold mb-1.5">{b}</h2>
              <ul className="space-y-1 pl-1">
                {byBuyer[b].map(({ flavor, expiry }, i) => (
                  <li key={i} className="text-sm">
                    — {flavor}{expiry ? ` (DLC ${formatDate(expiry)})` : ""}
                  </li>
                ))}
              </ul>
            </div>
          ))}
        </div>
      )}
    </>
  );
}

createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
